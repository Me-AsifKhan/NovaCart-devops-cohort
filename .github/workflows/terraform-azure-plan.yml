
name: NovaCart Azure Terraform Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate and Plan Only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: azure-development

    defaults:
      run:
        working-directory: infra/azure

    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_acr_name: ${{ vars.NOVACART_ACR_NAME }}
      TF_VAR_postgres_server_name: ${{ vars.NOVACART_POSTGRES_SERVER_NAME }}

      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: Check required configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${ARM_CLIENT_ID:?Missing AZURE_CLIENT_ID}"
          : "${ARM_TENANT_ID:?Missing AZURE_TENANT_ID}"
          : "${ARM_SUBSCRIPTION_ID:?Missing AZURE_SUBSCRIPTION_ID}"
          : "${TF_VAR_acr_name:?Missing NOVACART_ACR_NAME}"
          : "${TF_VAR_postgres_server_name:?Missing NOVACART_POSTGRES_SERVER_NAME}"

          if [[ ! "$TF_VAR_acr_name" =~ ^[A-Za-z0-9]{5,50}$ ]]; then
            echo "::error::ACR name must be 5-50 alphanumeric characters."
            exit 1
          fi

          if [[ ! "$TF_VAR_postgres_server_name" =~ ^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])$ ]]; then
            echo "::error::PostgreSQL name must use lowercase letters, numbers, and hyphens."
            exit 1
          fi

          if [[ "$TF_VAR_subscription_id" != "$ARM_SUBSCRIPTION_ID" ]]; then
            echo "::error::Subscription IDs do not match."
            exit 1
          fi

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform remote backend
        shell: bash
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="resource_group_name=rg-novacart-tfstate" \
            -backend-config="storage_account_name=stnovacarttf1027" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=novacart-dev.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true" \
            -backend-config="client_id=${ARM_CLIENT_ID}" \
            -backend-config="tenant_id=${ARM_TENANT_ID}" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}"

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Generate reviewable Terraform plan
        env:
          TF_VAR_db_admin_password: ${{ secrets.NOVACART_DB_ADMIN_PASSWORD }}
        run: terraform plan -input=false -no-color -lock-timeout=5m
