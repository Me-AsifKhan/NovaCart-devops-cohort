name: NovaCart Azure DEV Deployment

on:
  # Deliberately manual: merging an application PR must never deploy to Azure by itself.
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Type RELEASE to build and deploy the current main commit"
        type: choice
        options:
          - NO
          - RELEASE
        default: NO
        required: true
      backend_canary_percent:
        description: "Candidate backend share while validating the new revision"
        type: choice
        options:
          - "10"
          - "20"
          - "30"
        default: "20"
        required: true
      backend_canary_observation_seconds:
        description: "Seconds to observe the backend canary before full cutover"
        type: choice
        options:
          - "60"
          - "120"
          - "300"
        default: "120"
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: novacart-azure-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Publish, and Deploy DEV
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: azure-development

    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: ${{ vars.NOVACART_ACR_NAME }}
      AZURE_RESOURCE_GROUP: rg-novacart-dev
      ACA_ENV_NAME: cae-novacart-dev
      BACKEND_APP_NAME: ca-novacart-dev-backend
      FRONTEND_APP_NAME: ca-novacart-dev-frontend
      BACKEND_CANARY_PERCENT: ${{ inputs.backend_canary_percent }}
      BACKEND_CANARY_OBSERVATION_SECONDS: ${{ inputs.backend_canary_observation_seconds }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          set -euo pipefail
          : "${AZURE_CLIENT_ID:?Missing environment variable AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?Missing environment variable AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?Missing environment variable AZURE_SUBSCRIPTION_ID}"
          : "${ACR_NAME:?Missing environment variable NOVACART_ACR_NAME}"

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Azure DEV releases are permitted only from main."
            exit 1
          fi
          if [[ "$CONFIRM_RELEASE" != "RELEASE" ]]; then
            echo "::error::Release not confirmed. Select RELEASE in the manual workflow inputs."
            exit 1
          fi
          case "$BACKEND_CANARY_PERCENT" in
            10|20|30) ;;
            *) echo "::error::Backend canary percentage must be 10, 20, or 30."; exit 1 ;;
          esac
          case "$BACKEND_CANARY_OBSERVATION_SECONDS" in
            60|120|300) ;;
            *) echo "::error::Backend observation window must be 60, 120, or 300 seconds."; exit 1 ;;
          esac

          if [[ ! "$ACR_NAME" =~ ^[A-Za-z0-9]{5,50}$ ]]; then
            echo "::error::NOVACART_ACR_NAME must contain 5-50 alphanumeric characters."
            exit 1
          fi

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify DEV resources and record the current release
        id: azure_preflight
        shell: bash
        run: |
          set -euo pipefail

          az group show --name "$AZURE_RESOURCE_GROUP" --output none
          login_server="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
          test -n "$login_server"

          az containerapp show --name "$BACKEND_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output none
          az containerapp show --name "$FRONTEND_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --output none

          backend_mode="$(az containerapp show --name "$BACKEND_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.configuration.activeRevisionsMode" --output tsv)"
          frontend_mode="$(az containerapp show --name "$FRONTEND_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.configuration.activeRevisionsMode" --output tsv)"
          if [[ "${backend_mode,,}" != "multiple" || "${frontend_mode,,}" != "multiple" ]]; then
            echo "::error::Both apps must use Multiple revision mode from the reviewed Terraform configuration. No traffic was changed."
            exit 1
          fi

          backend_traffic="$(az containerapp show --name "$BACKEND_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.configuration.ingress.traffic" --output json)"
          frontend_traffic="$(az containerapp show --name "$FRONTEND_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.configuration.ingress.traffic" --output json)"
          old_backend_revision="$(jq -er '[.[] | select(.weight == 100 and ((.revisionName // "") != "")) | .revisionName] | if length == 1 then .[0] else empty end' <<< "$backend_traffic")"
          old_frontend_revision="$(jq -er '[.[] | select(.weight == 100 and ((.revisionName // "") != "")) | .revisionName] | if length == 1 then .[0] else empty end' <<< "$frontend_traffic")"

          old_backend_image="$(az containerapp revision show --name "$BACKEND_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$old_backend_revision" --query "properties.template.containers[?name=='novacart-backend'].image | [0]" --output tsv)"
          old_frontend_image="$(az containerapp revision show --name "$FRONTEND_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$old_frontend_revision" --query "properties.template.containers[?name=='novacart-frontend'].image | [0]" --output tsv)"
          frontend_fqdn="$(az containerapp show --name "$FRONTEND_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.configuration.ingress.fqdn" --output tsv)"
          default_domain="$(az containerapp env show --name "$ACA_ENV_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query "properties.defaultDomain" --output tsv)"

          : "${old_backend_image:?Could not identify previous backend image}"
          : "${old_frontend_image:?Could not identify previous frontend image}"
          : "${frontend_fqdn:?Could not identify frontend FQDN}"
          : "${default_domain:?Could not identify Container Apps environment domain}"

          az acr login --name "$ACR_NAME"

          {
            echo "login_server=$login_server"
            echo "default_domain=$default_domain"
            echo "frontend_url=https://$frontend_fqdn"
            echo "old_backend_revision=$old_backend_revision"
            echo "old_frontend_revision=$old_frontend_revision"
            echo "old_backend_image=$old_backend_image"
            echo "old_frontend_image=$old_frontend_image"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Pre-deployment state"
            echo "- Backend revision/image: $old_backend_revision / $old_backend_image"
            echo "- Frontend revision/image: $old_frontend_revision / $old_frontend_image"
            echo "- Frontend URL: https://$frontend_fqdn"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the current stable release before building candidates
        shell: bash
        env:
          FRONTEND_URL: ${{ steps.azure_preflight.outputs.frontend_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors --max-time 15 "${FRONTEND_URL}/" -o /dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors --max-time 15 "${FRONTEND_URL}/api/health" | jq -e '.status == "ok"' > /dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors --max-time 15 "${FRONTEND_URL}/api/ready" | jq -e '.status == "ready"' > /dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors --max-time 15 "${FRONTEND_URL}/api/products" | jq -e 'type == "array" and length >= 1' > /dev/null
          echo "The current stable frontend/API/database-readiness path passed before candidate creation." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish backend image
        id: build_backend
        uses: docker/build-push-action@v7
        with:
          context: ./novacart/backend
          push: true
          tags: ${{ steps.azure_preflight.outputs.login_server }}/novacart-backend:${{ github.sha }}

      - name: Build and publish frontend image
        id: build_frontend
        uses: docker/build-push-action@v7
        with:
          context: ./novacart/frontend
          push: true
          tags: ${{ steps.azure_preflight.outputs.login_server }}/novacart-frontend:${{ github.sha }}

      - name: Roll out revisions with health-gated cutover and rollback
        id: deploy_images
        shell: bash
        env:
          ACR_LOGIN_SERVER: ${{ steps.azure_preflight.outputs.login_server }}
          ACA_DEFAULT_DOMAIN: ${{ steps.azure_preflight.outputs.default_domain }}
          FRONTEND_URL: ${{ steps.azure_preflight.outputs.frontend_url }}
          OLD_BACKEND_REVISION: ${{ steps.azure_preflight.outputs.old_backend_revision }}
          OLD_FRONTEND_REVISION: ${{ steps.azure_preflight.outputs.old_frontend_revision }}
          OLD_BACKEND_IMAGE: ${{ steps.azure_preflight.outputs.old_backend_image }}
          OLD_FRONTEND_IMAGE: ${{ steps.azure_preflight.outputs.old_frontend_image }}
          BACKEND_DIGEST: ${{ steps.build_backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.build_frontend.outputs.digest }}
        run: |
          set -Eeuo pipefail

          REVISION_SUFFIX="r${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}"
          BACKEND_IMAGE="${ACR_LOGIN_SERVER}/novacart-backend@${BACKEND_DIGEST}"
          FRONTEND_IMAGE="${ACR_LOGIN_SERVER}/novacart-frontend@${FRONTEND_DIGEST}"
          NEW_BACKEND_REVISION="${BACKEND_APP_NAME}--${REVISION_SUFFIX}"
          NEW_FRONTEND_REVISION="${FRONTEND_APP_NAME}--${REVISION_SUFFIX}"
          CANDIDATE_FRONTEND_URL="https://${FRONTEND_APP_NAME}---candidate.${ACA_DEFAULT_DOMAIN}"
          TRAFFIC_SHIFTED=false
          PROMOTION_COMPLETE=false
          BACKEND_CANDIDATE_HITS=0

          rollback_on_error() {
            local exit_code="$1"
            local backend_restored=false
            local frontend_restored=false
            trap - ERR
            set +e
            echo "::error::Release validation failed. Attempting to restore the previous known-good revisions."
            {
              echo
              echo "### Rollout failure and rollback"
              echo "- **Release suffix:** ${REVISION_SUFFIX}"
              echo "- **Previous backend revision/image:** ${OLD_BACKEND_REVISION} / ${OLD_BACKEND_IMAGE}"
              echo "- **Previous frontend revision/image:** ${OLD_FRONTEND_REVISION} / ${OLD_FRONTEND_IMAGE}"
              echo "- **Failed candidate backend:** ${NEW_BACKEND_REVISION} (${BACKEND_IMAGE})"
              echo "- **Failed candidate frontend:** ${NEW_FRONTEND_REVISION} (${FRONTEND_IMAGE})"
            } >> "$GITHUB_STEP_SUMMARY"

            if [[ "$TRAFFIC_SHIFTED" == "true" ]]; then
              if az containerapp ingress traffic set \
                --name "$BACKEND_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --revision-weight "${OLD_BACKEND_REVISION}=100" \
                --output none; then
                backend_restored=true
                printf -- '- Backend traffic restored to `%s`.\n' "$OLD_BACKEND_REVISION" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::Could not restore backend traffic automatically; use the runbook and inspect the app now."
                echo "- **Backend rollback:** FAILED — operator action required." >> "$GITHUB_STEP_SUMMARY"
              fi

              if az containerapp ingress traffic set \
                --name "$FRONTEND_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --revision-weight "${OLD_FRONTEND_REVISION}=100" \
                --output none; then
                frontend_restored=true
                printf -- '- Frontend traffic restored to `%s`.\n' "$OLD_FRONTEND_REVISION" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::Could not restore frontend traffic automatically; use the runbook and inspect the app now."
                echo "- **Frontend rollback:** FAILED — operator action required." >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              backend_restored=true
              frontend_restored=true
              echo "- Production traffic was not changed before failure; the existing revisions remain the intended production targets." >> "$GITHUB_STEP_SUMMARY"
            fi

            # Stop candidate replicas only after old traffic is known to be restored.
            # If any restore leg failed, leave candidates available for operator diagnosis.
            if [[ "$backend_restored" == "true" && "$frontend_restored" == "true" ]]; then
              if az containerapp revision show --name "$BACKEND_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$NEW_BACKEND_REVISION" --output none 2>/dev/null; then
                if az containerapp revision deactivate --name "$BACKEND_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$NEW_BACKEND_REVISION" --output none; then
                  echo "- Candidate backend deactivated after rollback/no-cutover." >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "::warning::Could not deactivate candidate backend; review temporary replica cost."
                  echo "- **Cleanup warning:** candidate backend may remain active." >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
              if az containerapp revision show --name "$FRONTEND_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$NEW_FRONTEND_REVISION" --output none 2>/dev/null; then
                # Remove its candidate label before deactivating the candidate revision.
                if az containerapp revision label remove --name "$FRONTEND_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --label candidate --only-show-errors; then
                  echo "- Candidate frontend label removed." >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "- No candidate label was attached to the new frontend revision." >> "$GITHUB_STEP_SUMMARY"
                fi
                if az containerapp revision deactivate --name "$FRONTEND_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --revision "$NEW_FRONTEND_REVISION" --output none; then
                  echo "- Candidate frontend deactivated after rollback/no-cutover." >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "::warning::Could not deactivate candidate frontend; review temporary replica cost."
                  echo "- **Cleanup warning:** candidate frontend may remain active." >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
            else
              echo "- Candidate revisions were left available because at least one rollback leg failed; manual intervention is required." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$exit_code"
          }
          trap 'rollback_on_error "$?"' ERR

          wait_for_revision() {
            local app_name="$1"
            local revision_name="$2"
            local attempt revision_json provisioning running health
            for attempt in $(seq 1 40); do
              revision_json="$(az containerapp revision show \
                --name "$app_name" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --revision "$revision_name" \
                --output json)"
              provisioning="$(jq -r '.properties.provisioningState // ""' <<< "$revision_json")"
              running="$(jq -r '.properties.runningState // ""' <<< "$revision_json")"
              health="$(jq -r '.properties.healthState // ""' <<< "$revision_json")"

              if [[ "$provisioning" == "Failed" || "$health" == "Unhealthy" || "$running" == "Failed" ]]; then
                echo "::error::Revision $revision_name did not become healthy: provisioning=$provisioning running=$running health=$health"
                return 1
              fi
              if [[ "$provisioning" == "Provisioned" && "$running" == "Running" && ( -z "$health" || "$health" == "Healthy" ) ]]; then
                echo "Revision $revision_name is provisioned and running (health=$health)."
                return 0
              fi
              sleep 15
            done
            echo "::error::Timed out waiting for revision $revision_name; last state: provisioning=$provisioning running=$running health=$health"
            return 1
          }

          smoke_test_frontend() {
            local url="$1"
            echo "Smoke-testing ${url}"
            curl --fail --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors --max-time 15 "${url}/" -o /dev/null

            local health ready products health_headers served_revision
            health_headers="$(mktemp)"
            health="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors --max-time 15 --dump-header "$health_headers" "${url}/api/health")"
            jq -e '.status == "ok"' <<< "$health" > /dev/null

            served_revision="$(awk -F': *' 'tolower($1) == "x-novacart-revision:" { gsub(sprintf("%c", 13), "", $2); value = $2 } END { print value }' "$health_headers")"
            rm -f "$health_headers"
            if [[ "$served_revision" == "${NEW_BACKEND_REVISION}" ]]; then
              BACKEND_CANDIDATE_HITS=$((BACKEND_CANDIDATE_HITS + 1))
            fi
            echo "Backend revision serving /api/health: ${served_revision:-missing revision header}"

            ready="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors --max-time 15 "${url}/api/ready")"
            jq -e '.status == "ready"' <<< "$ready" > /dev/null

            products="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors --max-time 15 "${url}/api/products")"
            jq -e 'type == "array" and length >= 1' <<< "$products" > /dev/null
            echo "Smoke tests passed for ${url}: frontend, API health, database readiness, and products."
          }

          {
            echo "## NovaCart revision rollout"
            echo
            echo "- **Commit:** ${GITHUB_SHA}"
            echo "- **Run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- **Candidate suffix:** ${REVISION_SUFFIX}"
            echo "- **Previous backend:** ${OLD_BACKEND_REVISION} (${OLD_BACKEND_IMAGE})"
            echo "- **Previous frontend:** ${OLD_FRONTEND_REVISION} (${OLD_FRONTEND_IMAGE})"
            echo "- **Candidate backend:** ${NEW_BACKEND_REVISION} (${BACKEND_IMAGE})"
            echo "- **Candidate frontend:** ${NEW_FRONTEND_REVISION} (${FRONTEND_IMAGE})"
          } >> "$GITHUB_STEP_SUMMARY"

          # Create a candidate backend revision while the previous revision still owns 100% of traffic.
          az containerapp update \
            --name "$BACKEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$BACKEND_IMAGE" \
            --revision-suffix "$REVISION_SUFFIX" \
            --output none
          wait_for_revision "$BACKEND_APP_NAME" "$NEW_BACKEND_REVISION"

          # Backend is internal. Use a small weighted canary because tests must reach it
          # through the stable frontend proxy. Any failed request triggers traffic rollback.
          STABLE_BACKEND_PERCENT=$((100 - BACKEND_CANARY_PERCENT))
          TRAFFIC_SHIFTED=true
          az containerapp ingress traffic set \
            --name "$BACKEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision-weight "${OLD_BACKEND_REVISION}=${STABLE_BACKEND_PERCENT}" "${NEW_BACKEND_REVISION}=${BACKEND_CANARY_PERCENT}" \
            --output none
          {
            echo "- **Backend canary:** ${NEW_BACKEND_REVISION} receives ${BACKEND_CANARY_PERCENT}% while ${OLD_BACKEND_REVISION} retains ${STABLE_BACKEND_PERCENT}%."
            echo "- **Backend observation:** ${BACKEND_CANARY_OBSERVATION_SECONDS} seconds."
          } >> "$GITHUB_STEP_SUMMARY"

          for attempt in $(seq 1 $((BACKEND_CANARY_OBSERVATION_SECONDS / 10))); do
            smoke_test_frontend "$FRONTEND_URL"
            sleep 10
          done

          require_observed_candidate() {
            if (( BACKEND_CANDIDATE_HITS < 1 )); then
              echo "::error::No smoke-test response was proven to come from candidate backend revision ${NEW_BACKEND_REVISION}. Keep the old traffic target and rerun with a higher canary share or longer observation window."
              return 1
            fi
            echo "- **Verified backend canary responses:** ${BACKEND_CANDIDATE_HITS} response(s) carried X-NovaCart-Revision=${NEW_BACKEND_REVISION}." >> "$GITHUB_STEP_SUMMARY"
          }
          require_observed_candidate

          # Full cutover only after the repeated canary smoke tests pass and the candidate revision is directly observed.
          az containerapp ingress traffic set \
            --name "$BACKEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision-weight "${NEW_BACKEND_REVISION}=100" \
            --output none
          smoke_test_frontend "$FRONTEND_URL"

          # Create the frontend candidate without changing production frontend traffic.
          az containerapp update \
            --name "$FRONTEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$FRONTEND_IMAGE" \
            --revision-suffix "$REVISION_SUFFIX" \
            --output none
          wait_for_revision "$FRONTEND_APP_NAME" "$NEW_FRONTEND_REVISION"

          # Refresh the candidate label on reruns without touching main production traffic.
          if az containerapp revision label remove \
            --name "$FRONTEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --label candidate \
            --only-show-errors; then
            echo "Removed the previous candidate label."
          else
            echo "No prior candidate label to remove."
          fi
          az containerapp revision label add \
            --name "$FRONTEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --label candidate \
            --revision "$NEW_FRONTEND_REVISION" \
            --no-prompt --yes
          smoke_test_frontend "$CANDIDATE_FRONTEND_URL"

          # The candidate passed its own smoke tests. Cut over frontend traffic and verify again.
          az containerapp ingress traffic set \
            --name "$FRONTEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision-weight "${NEW_FRONTEND_REVISION}=100" \
            --output none
          smoke_test_frontend "$FRONTEND_URL"

          PROMOTION_COMPLETE=true
          # The release is fully validated now. Cleanup is best-effort and must not undo a healthy promotion.
          trap - ERR
          if az containerapp revision deactivate \
            --name "$BACKEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$OLD_BACKEND_REVISION" \
            --output none; then
            echo "Previous backend revision deactivated after successful validation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Previous backend revision remains active at zero traffic; review temporary duplicate-replica cost."
            echo "- **Cleanup warning:** previous backend revision may remain active with zero traffic." >> "$GITHUB_STEP_SUMMARY"
          fi
          if az containerapp revision deactivate \
            --name "$FRONTEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$OLD_FRONTEND_REVISION" \
            --output none; then
            echo "Previous frontend revision deactivated after successful validation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Previous frontend revision remains active at zero traffic; review temporary duplicate-replica cost."
            echo "- **Cleanup warning:** previous frontend revision may remain active with zero traffic." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo
            echo "### Promotion result"
            echo "- **Status:** SUCCESS"
            echo "- **Backend traffic target:** ${NEW_BACKEND_REVISION}"
            echo "- **Backend image:** ${BACKEND_IMAGE}"
            echo "- **Frontend traffic target:** ${NEW_FRONTEND_REVISION}"
            echo "- **Frontend image:** ${FRONTEND_IMAGE}"
            echo "- **Validation:** candidate frontend and post-cutover frontend/API health/readiness/products checks passed."
            echo "- **Rollback target retained:** ${OLD_BACKEND_REVISION} and ${OLD_FRONTEND_REVISION}, recorded above."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "backend_image=$BACKEND_IMAGE" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$FRONTEND_IMAGE" >> "$GITHUB_OUTPUT"
          echo "backend_revision=$NEW_BACKEND_REVISION" >> "$GITHUB_OUTPUT"
          echo "frontend_revision=$NEW_FRONTEND_REVISION" >> "$GITHUB_OUTPUT"
          echo "old_backend_revision=$OLD_BACKEND_REVISION" >> "$GITHUB_OUTPUT"
          echo "old_frontend_revision=$OLD_FRONTEND_REVISION" >> "$GITHUB_OUTPUT"
          echo "release_suffix=$REVISION_SUFFIX" >> "$GITHUB_OUTPUT"
          trap - ERR

      - name: Publish deployment summary
        if: always()
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.deploy_images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.deploy_images.outputs.frontend_image }}
          BACKEND_REVISION: ${{ steps.deploy_images.outputs.backend_revision }}
          FRONTEND_REVISION: ${{ steps.deploy_images.outputs.frontend_revision }}
        run: |
          {
            echo "## NovaCart Azure DEV deployment"
            echo
            echo "- **Result:** ${{ job.status }}"
            echo "- **Source commit:** [${GITHUB_SHA}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)"
            echo "- **Workflow run:** [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- **Resource group:** ${AZURE_RESOURCE_GROUP}"
            echo "- **Backend image:** ${BACKEND_IMAGE:-not published/deployed}"
            echo "- **Backend revision:** ${BACKEND_REVISION:-not verified}"
            echo "- **Frontend image:** ${FRONTEND_IMAGE:-not published/deployed}"
            echo "- **Frontend revision:** ${FRONTEND_REVISION:-not verified}"
          } >> "$GITHUB_STEP_SUMMARY"
