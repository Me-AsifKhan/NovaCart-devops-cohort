name: NovaCart Continuous Integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-test:
    name: NovaCart Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out codebase securely
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check Terraform formatting
        run: terraform -chdir=infra/azure fmt -check -recursive -diff

      - name: Initialize Terraform without configuring a backend
        run: terraform -chdir=infra/azure init -backend=false

      - name: Validate Terraform configuration
        run: terraform -chdir=infra/azure validate

      - name: Validate Docker Compose configuration
        env:
          GRAFANA_ADMIN_PASSWORD: ci-only-not-for-reuse
        run: docker compose -f novacart/compose.yaml config --quiet
      - name: Validate Prometheus config and alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/novacart/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/novacart/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.15.1 check rules /etc/prometheus/alerts.yml
      - name: Verify frontend structural assets
        run: |
          set -eu
          test -f novacart/frontend/index.html
          test -f novacart/frontend/app.js
          test -f novacart/frontend/styles.css

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Grafana dashboard JSON
        run: python -m json.tool novacart/observability/grafana/dashboards/novacart-overview.json > /dev/null

      - name: Install backend dependencies
        working-directory: novacart/backend
        run: |
          set -eu
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest httpx

      - name: Run backend tests
        working-directory: novacart/backend
        run: python -m pytest -v

      - name: Build backend container image
        run: docker build -t novacart-backend:ci ./novacart/backend

      - name: Build frontend container image
        run: docker build -t novacart-frontend:ci ./novacart/frontend
